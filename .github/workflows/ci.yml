name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: desk_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d desk_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/desk_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-enterprise.lock.txt
      - run: python -m pip install -r requirements-enterprise.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: docker build -t service-desk:ci .
